<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Solid Blue Squircle Background -->
  <rect x="0" y="0" width="64" height="64" rx="16" fill="#0070b3" />
  
  <!-- White Line-Art Calendar Icon -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Calendar Outline -->
    <rect x="14" y="20" width="36" height="30" rx="5" />
    
    <!-- Header Divider Line -->
    <line x1="14" y1="30" x2="50" y2="30" />
    
    <!-- Left Binder Ring -->
    <line x1="24" y1="14" x2="24" y2="24" />
    
    <!-- Right Binder Ring -->
    <line x1="40" y1="14" x2="40" y2="24" />
  </g>
</svg>
